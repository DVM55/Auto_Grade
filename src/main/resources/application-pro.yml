spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: social-app-hikari
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}

  liquibase:
    enabled: true
    change-log: classpath:changelog/db.changelog-master.yml

  ai:
    openai:
      api-key: ${API_KEY}
      chat:
        base-url: https://generativelanguage.googleapis.com
        completions-path: /v1beta/openai/chat/completions
        options:
          model: gemini-2.5-flash-lite
          temperature: 0.7
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  access-secret: ${JWT_ACCESS_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION}

minio:
  endpoint: ${ENDPOINT}
  accessKey: ${MINIO_ACCESS_KEY}
  secretKey: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}
  keyPrefix: ${MINIO_KEY_PREFIX}
  presignExpirySeconds: ${MINIO_PRESIGN_EXPIRY_SECONDS}
  makeBucketPublic: ${MINIO_MAKE_BUCKET_PUBLIC}

google:
  sheet:
    id: ${GOOGLE_SHEET_ID}
    range:  Contact!A:E

chatbot:
  agent:
    base-url: ${AGENT_BASE_URL}
    access-key: ${AGENT_ACCESS_KEY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

admin:
  email: ${ADMIN_EMAIL}
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}

mailgun:
  api-key: ${MAILGUN_API_KEY}
  domain: ${MAILGUN_DOMAIN}
  from: ${MAILGUN_FROM}
  from-name: ${MAILGUN_FROM_NAME}
  base-url: ${MAILGUN_BASE_URL}


